# Pinned sibling source checkouts under `.uv-workspace-siblings/`.
#
# uv.lock records agent-utilities (and, through it, epistemic-graph) as
# editable path sources (see [tool.uv.sources] in pyproject.toml), so a fresh
# clone cannot sync or check the lock until they exist on disk. This file is
# the one source of truth for which commit each is checked out at;
# scripts/bootstrap.sh reads it. Bump a pin by editing its commit here, then
# run `uv lock` and commit both files together.
#
# Columns: path  repository  commit  when
#   when = always -> needed for `uv sync --frozen` and the shared gates
#   when = lock   -> read for its metadata (`uv lock`, the uv-lock hook);
#                    built only by `scripts/bootstrap.sh --engine`
# bootstrap checks out every row.
.uv-workspace-siblings/agent-utilities  https://github.com/Knuckles-Team/agent-utilities  55f284ea38e39f28f7440971aef2c835ad349184  always
.uv-workspace-siblings/agent-utilities/.uv-workspace-siblings/agent-connector-sdk  https://github.com/Knuckles-Team/agent-connector-sdk  1bce84eac37dbad563cab42c22b9bb6a7baa1d84  always
.uv-workspace-siblings/agent-utilities/.uv-workspace-siblings/epistemic-graph  https://github.com/Knuckles-Team/epistemic-graph  6a795577dff539da06c52f467220422bf23e0b03  lock
