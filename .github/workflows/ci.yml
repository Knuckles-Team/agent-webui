name: CI

# The fleet fast-PR standard (pipelines reference/ci-standard.md). Never
# publishes: publication is release.yml, triggered only by a v* tag or a
# manual dispatch.
#
#   changes           -- classifies the PR diff (docs-only, UI paths).
#   hooks             -- the shared Knuckles-Team/pipelines gates workflow: this
#                        repo's .config/pre-commit.yaml at the commit and
#                        pre-push stages (diff-scoped on a PR, every file on
#                        main), including the spec hooks. A docs-only PR passes
#                        in seconds (docs-only-paths).
#   tests             -- WebUI-specific: bootstrap, type check and lint, then
#                        the pr-test-scope subset (PR) or the full suite (main).
#   workspace-browser -- Playwright journeys; on a PR only when UI paths change.
#   backward-python   -- Python 3.12 floor smoke; main and nightly only.
#   build             -- frontend bundle and wheel/sdist build; main and nightly.
#   ci-required       -- the one required check (`CI required`).
#   gates             -- alias kept so the `gates` ruleset check keeps reporting
#                        until the ruleset requires `CI required`.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.event.pull_request.number) || format('main-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
      ui: ${{ steps.scope.outputs.ui }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Classify the diff
        id: scope
        run: |
          set -euo pipefail
          # checkout tests GitHub's synthetic merge; its first parent is the target.
          files="$(git diff --name-only HEAD^1 HEAD)"
          code=false
          ui=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              specs/*|docs/*|*.md|plans/*|LICENSE) ;;
              *) code=true ;;
            esac
            case "$f" in
              src/*|e2e/*|public/*|patches/*|scripts/*|index.html|package.json|pnpm-lock.yaml|vite.config.ts|vitest.config.ts|playwright.config.ts|tsconfig.json|.github/workflows/ci.yml) ui=true ;;
            esac
          done <<< "$files"
          echo "code=$code ui=$ui"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"

  hooks:
    name: hooks
    permissions:
      contents: read
    uses: Knuckles-Team/pipelines/.github/workflows/gates_pipeline.yml@main
    with:
      config: .config/pre-commit.yaml
      # Tests need the bootstrap below, so the `tests` job owns them.
      test-scope: ''
      # Homelab self-hosted runner for same-repo traffic; a fork PR always
      # lands on the GitHub-hosted runner.
      runner: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","homelab"]' || '"ubuntu-latest"' }}
      # These hooks need the bootstrapped siblings or the Node toolchain; the
      # `tests` job runs them after bootstrap; its mandatory full lint owns
      # eslint-staged's coverage without a duplicate whole-repository pass.
      # ste-staged (STE-lite prose lint) is advisory: the `tests` job runs it
      # report-only (operator gate cut).
      skip-hooks: check-stubs,check-sprawl,okf-no-legacy-concepts,uv-lock,eslint-staged,no-fabrication-gate,ste-staged
      all-files: ${{ github.event_name != 'pull_request' }}
      # Bash patterns (`*` crosses `/`); replaces the retired skip companion.
      docs-only-paths: 'specs/* docs/* *.md plans/* LICENSE'
      timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 60 }}

  workspace-browser:
    name: workspace-browser
    # Synthetic workspace identity/contrast, modal cancellation and catalog navigation.
    # Hosted Chromium avoids the cloud editor's isolated loopback namespace.
    needs: [changes]
    if: ${{ always() && (github.event_name != 'push' && (github.event_name != 'pull_request' || needs.changes.outputs.ui == 'true')) }}
    runs-on: ubuntu-latest
    # Allow measured dependency-download overhead without reducing browser coverage.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install locked frontend dependencies
        id: browser_dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and system dependencies
        id: browser_engine
        run: pnpm exec playwright install --with-deps chromium
      - name: Capture Liquid Glass reference preview
        id: liquid_glass_preview
        if: ${{ !cancelled() && steps.browser_dependencies.outcome == 'success' && steps.browser_engine.outcome == 'success' }}
        run: LIQUID_GLASS_PREVIEW=1 pnpm exec playwright test --config e2e/canopy-glass.config.ts --grep 'Liquid Glass reference preview' --output test-results/liquid-glass-preview
      - name: Preserve first Liquid Glass pixels and transition video
        if: ${{ always() && (steps.liquid_glass_preview.outcome == 'success' || steps.liquid_glass_preview.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: liquid-glass-preview
          path: test-results/liquid-glass-preview/
          retention-days: 14
          if-no-files-found: error
      - name: Workspace identity, native readability and cancellation
        id: workspace_identity
        if: ${{ !cancelled() && steps.browser_dependencies.outcome == 'success' && steps.browser_engine.outcome == 'success' }}
        run: pnpm exec playwright test --config e2e/workspace-identity.config.ts
      - name: Preserve workspace identity and native task access evidence
        if: ${{ always() && (steps.workspace_identity.outcome == 'success' || steps.workspace_identity.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace-identity-browser
          path: |
            test-results/workspace-identity*/
            test-results/work-task-refresh*/
          retention-days: 14
          if-no-files-found: error
      - name: Catalog destination history and responsive navigation
        id: workspace_catalog
        if: ${{ !cancelled() && steps.browser_dependencies.outcome == 'success' && steps.browser_engine.outcome == 'success' }}
        run: pnpm exec playwright test --config e2e/workspace-branches.config.ts workspace-catalog
      - name: Canopy Glass and native graph, workflow and usage lenses
        id: canopy_native
        if: ${{ !cancelled() && steps.browser_dependencies.outcome == 'success' && steps.browser_engine.outcome == 'success' }}
        run: pnpm exec playwright test --config e2e/canopy-glass.config.ts --grep-invert 'Liquid Glass reference preview'
      - name: Native 200 percent zoom and keyboard reachability
        id: native_zoom
        if: ${{ !cancelled() && steps.browser_dependencies.outcome == 'success' && steps.browser_engine.outcome == 'success' }}
        run: pnpm exec playwright test --config e2e/workspace-zoom.config.ts --output=test-results/canopy-glass/zoom
      - name: Preserve Canopy Glass browser evidence
        if: ${{ always() && (steps.canopy_native.outcome == 'success' || steps.canopy_native.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canopy-glass-browser
          path: test-results/canopy-glass/
          retention-days: 14
          if-no-files-found: error
      - name: Install pinned documentation image helper
        if: ${{ !cancelled() && steps.browser_dependencies.outcome == 'success' && steps.browser_engine.outcome == 'success' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/screenshot-tools"
          "$RUNNER_TEMP/screenshot-tools/bin/python" -m pip install -r scripts/screenshot-requirements.txt
          echo "SCREENSHOT_PYTHON=$RUNNER_TEMP/screenshot-tools/bin/python" >> "$GITHUB_ENV"

      - name: Documentation screenshot contract
        id: documentation_contract
        if: ${{ !cancelled() && steps.browser_dependencies.outcome == 'success' && steps.browser_engine.outcome == 'success' }}
        run: pnpm screenshots:test
      - name: Refresh synthetic documentation screenshots
        id: documentation_capture
        if: ${{ !cancelled() && steps.browser_dependencies.outcome == 'success' && steps.browser_engine.outcome == 'success' }}
        run: pnpm screenshots:refresh
      - name: Flat execution graph keyboard and responsive fixtures
        id: execution_graph
        if: ${{ !cancelled() && steps.browser_dependencies.outcome == 'success' && steps.browser_engine.outcome == 'success' }}
        run: pnpm exec playwright test --config e2e/workspace-layout.config.ts execution-graph.browser.ts --output test-results/workspace-execution-graph
      - name: Preserve flat execution graph browser evidence
        if: ${{ always() && (steps.execution_graph.outcome == 'success' || steps.execution_graph.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace-execution-graph
          path: test-results/workspace-execution-graph/
          retention-days: 14
          if-no-files-found: error
      - name: Preserve documentation screenshots and provenance
        if: ${{ always() && (steps.documentation_capture.outcome == 'success' || steps.documentation_capture.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-screenshots
          path: test-results/documentation-screenshots/
          retention-days: 14
          if-no-files-found: error
      - name: Preserve synthetic catalog browser evidence
        if: ${{ always() && (steps.workspace_catalog.outcome == 'success' || steps.workspace_catalog.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace-catalog-browser
          path: test-results/workspace-catalog*/
          retention-days: 3
          if-no-files-found: ignore

  tests:
    name: tests
    needs: [changes]
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') }}
    # Cold runs measured ~12m before full lint/tests; the hostile-route file
    # alone takes ~3m. Budget for those gates plus setup/cache-save variance.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 25 || 60 }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "homelab"]') || 'ubuntu-latest' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Keep cached wheels on the work volume so installs can use hardlinks.
          cache-local-path: ${{ runner.temp }}/agent-webui/uv-cache

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          # Cache the content-addressed store, never node_modules; bootstrap
          # still installs from the frozen lock on every run.
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Bootstrap (gate tooling, locked Python and frontend deps)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/bootstrap.sh --no-hooks

      - name: Route census architecture gate
        run: pnpm run gate:route-census

      - name: Bootstrap-dependent hooks (siblings, lockfile, Node toolchain)
        timeout-minutes: 15
        env:
          PRE_COMMIT_HOME: ${{ runner.temp }}/pre-commit-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for hook in check-stubs check-sprawl okf-no-legacy-concepts; do
            uvx pre-commit run "$hook" --config .config/pre-commit.yaml --hook-stage pre-commit --all-files --show-diff-on-failure
          done
          # The mandatory full lint step below covers eslint-staged's files
          # with the same locked ESLint/config; do not lint all files twice.
          for hook in uv-lock no-fabrication-gate; do
            uvx pre-commit run "$hook" --config .config/pre-commit.yaml --hook-stage pre-push --all-files --show-diff-on-failure
          done

      - name: STE-lite prose lint (advisory, report-only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          PRE_COMMIT_HOME: ${{ runner.temp }}/pre-commit-${{ github.run_id }}-${{ github.run_attempt }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uvx pre-commit run ste-staged --config .config/pre-commit.yaml --hook-stage pre-commit --from-ref "$BASE_SHA" --to-ref HEAD

      - name: Type check and full lint (manual-stage hooks, always full)
        timeout-minutes: 15
        env:
          PRE_COMMIT_HOME: ${{ runner.temp }}/pre-commit-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          uvx pre-commit run typecheck --config .config/pre-commit.yaml --hook-stage manual --all-files
          uvx pre-commit run lint --config .config/pre-commit.yaml --hook-stage manual --all-files

      # The base the differential steps compare against: the pull request
      # base or the previous push, else the root commit.
      - name: Resolve the published base
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # checkout tests GitHub's synthetic merge. Its first parent is
            # the actual target; the event's base SHA can lag behind main.
            # Fail closed if checkout ever changes to the direct PR head.
            BASE="$(git rev-parse --verify HEAD^1)"
            test "$(git rev-parse --verify HEAD^2)" = "$PR_HEAD_SHA"
          else
            BASE="${{ github.event.before }}"
            if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
              BASE="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi
          echo "PRE_COMMIT_FROM_REF=$BASE" >> "$GITHUB_ENV"

      - name: Resolve pull-request Python test scope
        if: github.event_name == 'pull_request'
        id: pr-test-scope
        run: |
          set -euo pipefail
          # The mapper accepts one root per call. Use only pytest.ini's roots,
          # then deduplicate their results for one pytest invocation.
          candidates="$RUNNER_TEMP/pr-test-scope-candidates.txt"
          scope="$RUNNER_TEMP/pr-test-scope.txt"
          : > "$candidates"
          for test_root in agent/agent_webui/__tests__ tests; do
            uvx --from 'git+https://github.com/Knuckles-Team/pipelines@main' \
              pipelines-hook pr-test-scope --base-ref "$PRE_COMMIT_FROM_REF" \
              --src-root agent/agent_webui --tests-root "$test_root" >> "$candidates"
          done
          if grep -qx FULL "$candidates"; then
            printf '%s\n' FULL > "$scope"
          else
            awk '$0 != "NONE" && !seen[$0]++' "$candidates" > "$scope"
            if [ ! -s "$scope" ]; then printf '%s\n' NONE > "$scope"; fi
          fi
          cat "$RUNNER_TEMP/pr-test-scope.txt"
          {
            echo "scope<<PR_TEST_SCOPE_EOF"
            cat "$RUNNER_TEMP/pr-test-scope.txt"
            echo "PR_TEST_SCOPE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve pull-request TypeScript/React changed files
        if: github.event_name == 'pull_request'
        id: pr-ts-scope
        run: |
          set -euo pipefail
          changed="$(git diff --name-only --diff-filter=ACMR "$PRE_COMMIT_FROM_REF"...HEAD -- '*.ts' '*.tsx' | grep -v '^node_modules/' || true)"
          echo "$changed"
          {
            echo "files<<PR_TS_SCOPE_EOF"
            echo "$changed"
            echo "PR_TS_SCOPE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Full test suite (push to main / workflow_dispatch)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -q --tb=short -m "not slow" --timeout=60
          pnpm test

      - name: Python test suite -- pull request fast subset
        if: github.event_name == 'pull_request'
        env:
          SCOPE: ${{ steps.pr-test-scope.outputs.scope }}
        run: |
          set -euo pipefail
          if [ "$SCOPE" = "NONE" ]; then
            echo "pr-test-scope: no affected Python tests in the declared roots; skipping pytest"
          elif [ "$SCOPE" = "FULL" ]; then
            echo "pr-test-scope: unmapped source change (or an unreadable diff); running the full suite"
            .venv/bin/python -m pytest -q --tb=short -m "not slow" --timeout=60
          else
            echo "pr-test-scope: running only the tests this diff affects:"
            echo "$SCOPE"
            mapfile -t affected_tests <<< "$SCOPE"
            .venv/bin/python -m pytest "${affected_tests[@]}" -q --tb=short -m "not slow" --timeout=60
          fi

      - name: TypeScript test suite -- pull request fast subset (vitest related)
        if: github.event_name == 'pull_request'
        env:
          CHANGED: ${{ steps.pr-ts-scope.outputs.files }}
        run: |
          set -euo pipefail
          if [ -z "$(echo "$CHANGED" | tr -d '[:space:]')" ]; then
            echo "no .ts/.tsx change in this diff; skipping vitest"
          else
            echo "running vitest related for:"
            echo "$CHANGED"
            mapfile -t changed_files <<< "$CHANGED"
            pnpm exec vitest related "${changed_files[@]}" --run
          fi

  build:
    name: build
    needs: [hooks, tests]
    if: ${{ always() && github.event_name != 'pull_request' && needs.hooks.result == 'success' && needs.tests.result == 'success' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run build

      - name: Build Python distributions (no upload)
        run: uv build

  backward-python:
    # The one backward-support leg (pipelines reference/gate-standard.md
    # "Python version"): the environment is 3.14, requires-python keeps a 3.12
    # floor, so install the lock on 3.12 and import the package.
    name: backward-python (3.12)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
      - name: Install and import on the 3.12 floor
        run: |
          set -euo pipefail
          uv sync --frozen --no-dev --python 3.12
          uv run --frozen --no-sync python -c 'import sys, agent_webui; print(sys.version)'

  ci-required:
    name: CI required
    if: always()
    needs: [changes, hooks, tests, workspace-browser, backward-python, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail on any failed or cancelled job (skipped is fine)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in failure|cancelled) echo "::error::a required job ended $r"; exit 1;; esac
          done

  gates:
    # Alias of `CI required` for the ruleset that still requires `gates`.
    name: gates
    if: always()
    needs: [ci-required]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mirror CI required
        env:
          RESULT: ${{ needs.ci-required.result }}
        run: |
          echo "ci-required=$RESULT"
          [ "$RESULT" = success ]
