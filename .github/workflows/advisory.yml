name: Advisory

# ─────────────────────────────────────────────────────────────────────────
# Half of the two-workflow model -- see release.yml's top-of-file comment
# for the full explanation. In short: this workflow REPORTS, it never
# BLOCKS. release-blocking checks live only in release.yml.
#
# Every step below that can fail runs with `continue-on-error: true` (a
# STEP-level key here, deliberately, not job-level: a job-level
# `continue-on-error` does not stop GitHub Actions from SKIPPING the
# remaining steps in that job once an earlier one fails without its own
# `continue-on-error` -- only per-step `continue-on-error` keeps later
# steps running so every check still gets a chance to report) so a red step
# here never fails the workflow run as a hard blocker, but stays clearly
# visible as a red step in the Actions UI and in `::warning::` annotations.
#
# Carries the `pages` job (formerly the standalone pages.yml). It was folded
# in here rather than left standalone because docs deploy has no business
# blocking a package/image release either way -- same reasoning as
# agent-utilities' own advisory.yml, which folded ITS pages job in for the
# same reason (there, Pages' `pip install -e .` shared the exact cross-repo
# epistemic-graph release-order deadlock the PyPI/Docker release path hits).
# agent-webui's `pages_pipeline.yml` doesn't install agent-webui or
# agent-utilities at all today (just mkdocs + its plugins), so this repo's
# docs build doesn't currently share that specific failure mode -- but it's
# still not a release-blocking check, so it belongs here rather than a
# third independent workflow file.
#
# Rewritten as bespoke steps (previously: `uses: .../pages_pipeline.yml`)
# because reusable-workflow-call jobs only accept a fixed key set --
# `name`, `uses`, `with`, `secrets`, `strategy`, `needs`, `if`,
# `concurrency`, `permissions` -- and `continue-on-error` is not among them.
# Adding it to a `uses:` job doesn't make that step advisory; it makes the
# GitHub Actions parser reject the whole file ("Unexpected value
# 'continue-on-error'"), the same class of failure release.yml's own
# comment documents for `environment:` on a `uses:` job.
# ─────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages:
    name: Deploy GitHub Pages (report only, never blocks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install MkDocs
        id: install
        continue-on-error: true
        run: pip install mkdocs-material mkdocs-awesome-pages-plugin

      - name: Build Docs
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: mkdocs build

      - name: Setup Pages
        if: steps.install.outcome == 'success'
        continue-on-error: true
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        if: steps.install.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.install.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Report install failure
        if: steps.install.outcome != 'success'
        run: |
          echo "::warning::pages job could not install mkdocs -- this does not block any release; docs redeploy automatically once installable again."
          exit 0
