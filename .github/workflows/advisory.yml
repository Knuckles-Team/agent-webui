name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages:
    name: Build and deploy the shared documentation experience
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: Knuckles-Team/pipelines/.github/workflows/pages_pipeline.yml@e841cfe67d3e13ddf52aee32a4580f9c7cf9ec80
    with:
      content_source: docs
      shared_theme_enabled: true
