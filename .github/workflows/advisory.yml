name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages:
    name: Build and deploy the shared documentation experience
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: Knuckles-Team/pipelines/.github/workflows/pages_pipeline.yml@1d12b14a9f51c889316591c6314f4fc835660870
    with:
      content_source: docs
      shared_theme_enabled: true
