name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages:
    name: Build and deploy the shared documentation experience
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: Knuckles-Team/pipelines/.github/workflows/pages_pipeline.yml@479c6652266b6265c5a66d167af086edb837844b
    with:
      content_source: docs
      shared_theme_enabled: true
