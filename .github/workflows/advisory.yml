name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages:
    name: Build and deploy the shared documentation experience
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: Knuckles-Team/pipelines/.github/workflows/pages_pipeline.yml@73915f29ae672003a0bed287f85e19390d55f4d0
    with:
      content_source: docs
      shared_theme_enabled: true
