name: Release

# ─────────────────────────────────────────────────────────────────────────
# THE TWO-WORKFLOW MODEL (read this before adding a check to either file)
#
# This repo ships exactly two GitHub Actions workflows, matching the model
# already landed in agent-utilities and epistemic-graph:
#
#   release.yml (THIS FILE) -- the ONLY workflow that can block a release.
#     Two jobs, wired with `needs:` so the ordering is explicit and the
#     failing stage is obvious at a glance:
#
#       publish-pypi   -- builds the agent-webui wheel and sdist, verifies an
#                         existing immutable PyPI release byte-for-byte,
#                         publishes only when absent, then tags/releases the
#                         source commit. It consumes the fleet's shared release
#                         action but keeps the WebUI-specific preflight local.
#       publish-docker -- needs: publish-pypi. Builds and publishes the
#                         container image FROM THE SAME COMMIT, consuming
#                         whatever agent-utilities/epistemic-graph floor is
#                         actually resolvable once PyPI publish has landed.
#
#   advisory.yml -- everything else (currently: GitHub Pages). Every job
#     there runs with `continue-on-error: true` so debt stays visible (red
#     job, annotation, job summary) but never blocks a release.
#
# WHY: this replaced THREE independent workflows (`pipeline.yml` for PyPI,
# `docker-publish.yml` for the container image, `pages.yml` for docs) that
# had no explicit relationship to each other. `docker-publish.yml` triggered
# on `push: tags: ['v*']` -- which happened to fire only AFTER `pipeline.yml`
# succeeded, because `python_pipeline.yml` creates that tag as its own
# last step (`softprops/action-gh-release`, `tag_name: v${BUILD_VERSION}`).
# That made PyPI-then-Docker ordering an accidental side effect of two
# decoupled workflows reacting to two separate push events, not something
# this repo declared on purpose -- exactly what the owner asked to fix
# ("it should all be one pipeline -- first builds the pypi image for
# agent-webui, then runs the docker build job to include the newly
# published pypi package"). `needs: publish-pypi` below makes that ordering
# structural instead of incidental.
#
# CROSS-REPO ORDERING: epistemic-graph must publish to PyPI before
# agent-utilities can be installed from a plain index, because
# agent-utilities pins a version floor on it. `publish-docker` below
# verifies that floor is actually resolvable on PyPI
# (scripts/release/check_eg_pypi_resolvable.py, adapted from
# agent-utilities' own script of the same name and purpose) and fails with
# one clear message naming the missing version, rather than letting `uv pip
# install` die deep inside a resolver backtrace -- which is also why the
# former `docker-publish.yml` had its own `build-eg-wheel` job compiling
# epistemic-graph from source in CI: a workaround for eg never having
# published a satisfying release, not a deliberate bundling choice. That job
# is gone; the image now installs epistemic-graph from PyPI like any normal
# dependency, and this gate makes the "not yet published" case fail loudly
# instead of silently, deep inside a build.
# ─────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── STAGE 1: build + publish the agent-webui wheel to PyPI, then tag the
  # release commit. This remains structurally equivalent to the fleet's
  # shared Python publication pipeline, while owning WebUI's stricter
  # immutable-version preflight: an existing release is success only when
  # every filename and SHA-256 digest matches the artifacts built here.
  publish-pypi:
    name: publish-pypi
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout pipeline release contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Knuckles-Team/pipelines
          ref: main
          sparse-checkout: |
            .github/actions
          path: .pipeline-contract
          persist-credentials: false

      - name: Bind source and pipeline commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "PIPELINES_CONTRACT_COMMIT=$(git -C .pipeline-contract rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run build

      - name: Build Python distributions
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.13 .venv
          source .venv/bin/activate
          uv pip install -r requirements.txt || true
          uv pip install --require-hashes -r .pipeline-contract/.github/actions/publish-python-package/twine-requirements.txt
          uv build
          BUILD_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          {
            echo "BUILD_VERSION=${BUILD_VERSION}"
            echo "LATEST_COMMIT=${GITHUB_SHA}"
            echo "COMMIT_DATETIME=$(date -u '+%m/%d/%Y %H:%M:%S')"
            echo "COMMIT_MESSAGE=$(git log -1 --format=%B "${GITHUB_SHA}" | tr '\n' ' ')"
          } >> "$GITHUB_ENV"

      - name: Verify source commit after build
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event.repository.name }}-${{ env.BUILD_VERSION }}
          path: dist/*.whl
          if-no-files-found: error

      - name: Check immutable PyPI artifact state
        id: pypi_preflight
        run: python3 scripts/release/check_pypi_artifacts.py pyproject.toml dist --github-output "$GITHUB_OUTPUT"

      - name: Publish package when absent
        if: steps.pypi_preflight.outputs.publish == 'true'
        shell: bash
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          if ! .venv/bin/twine upload dist/* --verbose; then
            echo "Upload failed; checking whether a concurrent publisher completed the exact release."
            python3 scripts/release/check_pypi_artifacts.py pyproject.toml dist --expect-existing
          fi

      - name: Create Release
        uses: ./.pipeline-contract/.github/actions/create-version-release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ── STAGE 2: build + publish the container image. Needs: publish-pypi --
  # unreachable unless the PyPI stage above (including its tag-and-release
  # step) already succeeded on this exact commit.
  publish-docker:
    name: publish-docker
    needs: publish-pypi
    runs-on: ubuntu-latest
    # D-ORC-10-style gate (matches agent-utilities' own publish-docker job):
    # a protected GitHub Environment enables required-reviewer / wait-timer
    # rules once an admin configures them under
    # Settings > Environments > docker-publish. Safe to set here because this
    # is a normal job (runs-on + steps), NOT a `uses:` job -- putting
    # `environment:` on a `uses:` job makes the GitHub Actions parser reject
    # the whole file ("Unexpected value 'uses'"), which is exactly why
    # `publish-pypi` above does not have one.
    environment: docker-publish
    steps:
      # Belt-and-suspenders confirmation that this commit really is a
      # published release, not merely a commit that happens to follow one:
      # `publish-pypi` creates a `vX.Y.Z` tag pointing at this exact commit as
      # its last step (through the fleet's shared release action), so
      # by the time `needs: publish-pypi` has been satisfied the tag should
      # already exist. Failing loudly here if it doesn't catches a
      # partial-success case (e.g. the tag/release step itself regresses
      # upstream in a way that doesn't fail the calling job).
      - name: Require a vX.Y.Z release tag on the published commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tags="$(gh api "repos/${{ github.repository }}/tags?per_page=100" \
            | jq -r --arg sha "$HEAD_SHA" '.[] | select(.commit.sha == $sha) | .name')"
          if ! grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' <<<"$tags"; then
            echo "::error::release gate: no vX.Y.Z tag points at $HEAD_SHA -- publish-pypi should have created one on success. Refusing to publish the image against an unreleased commit."
            exit 1
          fi
          echo "release tag verified: $tags"

      - name: Checkout agent-webui
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Never installed from PyPI (D-W5WR-1) -- built from source, same as
      # docker/build_and_push.sh's AU_SRC_PATH. PyPI's newest agent-utilities
      # (1.26.4, verified 2026-08-07) is missing modules this app imports at
      # startup; see docker/Dockerfile's header for the full empirical trail.
      - name: Checkout agent-utilities (au-src build context)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Knuckles-Team/agent-utilities
          ref: main
          path: au-src
          persist-credentials: false

      # ---- Cross-repo release-order gate (see top-of-file comment). Stdlib
      # -only, no environment sync needed: verifies the epistemic-graph floor
      # au-src/pyproject.toml declares is actually resolvable on PyPI before
      # spending any build time. eg must publish before au; au must publish
      # before this image can install it from the index. Turns that deadlock
      # into one clear line instead of a pip resolver backtrace.
      #
      # `--extras agent-headless,graph,metrics` scopes the check to exactly
      # the extras the runtime stage below actually installs
      # (docker/Dockerfile's
      # `uv pip install ... "${AU_WHEEL}[agent-headless,graph,metrics]"`) --
      # none of which pull in epistemic-graph (GOC-73's `graphos` extra is
      # opt-in and not among them, including transitively through
      # `agent-headless`'s own self-referenced `mcp`/`sandbox`). Without
      # this the gate scanned au-src's WHOLE pyproject.toml (every
      # optional-dependencies entry, `graphos` included) and failed even
      # though this image never resolves epistemic-graph from PyPI at all.
      # Keep this flag's extras list in sync with the runtime
      # `uv pip install` line if that ever changes.
      - name: Verify required epistemic-graph release is resolvable on PyPI
        run: python3 scripts/release/check_eg_pypi_resolvable.py au-src/pyproject.toml --extras agent-headless,graph,metrics

      - name: Compute build metadata
        id: meta_build
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/agent-webui
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          build-contexts: |
            au-src=au-src
          build-args: |
            BUILD_SHA=${{ steps.meta_build.outputs.sha }}
            BUILD_TIME=${{ steps.meta_build.outputs.time }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Same check docker/build_and_push.sh runs locally before it will push --
      # confirms the pushed image's served bundle actually carries this commit,
      # not a stale cached layer, using the tag `metadata-action` just resolved
      # (so this pulls the exact manifest just pushed, not a mutable `:latest`
      # someone else could have moved in the meantime).
      - name: Verify pushed image serves today's build-info.txt
        run: |
          set -euo pipefail
          IMAGE_REF="$(head -n1 <<<"${{ steps.meta.outputs.tags }}")"
          INFO="$(docker run --rm --entrypoint sh "${IMAGE_REF}" -c \
            'cat "$(python3 -c "import agent_webui, os; print(os.path.join(os.path.dirname(agent_webui.__file__), \"dist\", \"build-info.txt\"))")"')"
          echo "${INFO}"
          grep -q "sha=${{ steps.meta_build.outputs.sha }}$" <<<"${INFO}"
