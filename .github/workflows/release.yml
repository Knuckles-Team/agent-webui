name: Release

# Tag-only release (CI-STANDARD): this workflow runs ONLY on a `v*` tag push or
# a manual dispatch. An ordinary push to main never reaches it, so nothing is
# published from main and `[skip ci]` is not needed. PR and main checks live in
# ci.yml; documentation lives in pages.yml.
#
#   release-intent -- on the tagged commit, retains exact artifact verification
#                     (an existing immutable PyPI release must match byte for
#                     byte); a manual dispatch from a later release-neutral
#                     commit is skipped.
#   publish-pypi   -- fails fast on any ref that is not a v* tag (dispatch from
#                     a tag is allowed), builds the wheel and sdist, verifies an
#                     existing immutable PyPI release, publishes only when
#                     absent, then creates the GitHub release for the tag.
#   publish-docker -- needs: publish-pypi. Builds and publishes the container
#                     image FROM THE SAME COMMIT; the image installs the
#                     wheel and every dependency (agent-utilities included)
#                     from PyPI.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-intent:
    name: release-intent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.intent.outputs.release }}
    steps:
      - name: Checkout Repository with release tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether this commit enters the release pipeline
        id: intent
        shell: bash
        run: |
          python3 scripts/release/check_pypi_artifacts.py pyproject.toml \
            --release-intent --repository . --head-sha "${GITHUB_SHA}" \
            --github-output "${GITHUB_OUTPUT}"

  # ── STAGE 1: build + publish the agent-webui wheel to PyPI, then tag the
  # release commit. This remains structurally equivalent to the fleet's
  # shared Python publication pipeline, while owning WebUI's stricter
  # immutable-version preflight: an existing release is success only when
  # every filename and SHA-256 digest matches the artifacts built here.
  publish-pypi:
    name: publish-pypi
    needs: [release-intent]
    if: needs.release-intent.outputs.release == 'true'
    runs-on: self-hosted
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Require a release tag
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ ! "$REF" =~ ^refs/tags/v ]]; then
            echo "::error::publish only from a v* release tag; $REF is not one."
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout pipeline release contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Knuckles-Team/pipelines
          ref: main
          sparse-checkout: |
            .github/actions
          path: .pipeline-contract
          persist-credentials: false

      - name: Bind source and pipeline commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "PIPELINES_CONTRACT_COMMIT=$(git -C .pipeline-contract rev-parse HEAD)" >> "$GITHUB_ENV"
          # wheel-readiness binds its receipt to the source commit.
          echo "SOURCE_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run build

      - name: Build Python distributions
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.13 .venv
          source .venv/bin/activate
          uv pip install -r requirements.txt || true
          uv pip install --require-hashes -r .pipeline-contract/.github/actions/publish-python-package/twine-requirements.txt
          uv build
          BUILD_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          {
            echo "BUILD_VERSION=${BUILD_VERSION}"
            echo "LATEST_COMMIT=${GITHUB_SHA}"
            echo "COMMIT_DATETIME=$(date -u '+%m/%d/%Y %H:%M:%S')"
            echo "COMMIT_MESSAGE=$(git log -1 --format=%B "${GITHUB_SHA}" | tr '\n' ' ')"
          } >> "$GITHUB_ENV"

      - name: Verify source commit after build
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event.repository.name }}-${{ env.BUILD_VERSION }}
          path: dist/*.whl
          if-no-files-found: error

      # The shared create-version-release action verifies this proof
      # (release-readiness.json) before it creates the GitHub release.
      - name: Prove wheel runtime readiness
        uses: ./.pipeline-contract/.github/actions/wheel-readiness

      - name: Check immutable PyPI artifact state
        id: pypi_preflight
        run: python3 scripts/release/check_pypi_artifacts.py pyproject.toml dist --github-output "$GITHUB_OUTPUT"

      - name: Publish package when absent
        if: steps.pypi_preflight.outputs.publish == 'true'
        shell: bash
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          if ! .venv/bin/twine upload dist/*.whl dist/*.tar.gz --verbose; then
            echo "Upload failed; checking whether a concurrent publisher completed the exact release."
            python3 scripts/release/check_pypi_artifacts.py pyproject.toml dist --expect-existing
          fi

      - name: Create Release
        uses: ./.pipeline-contract/.github/actions/create-version-release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ── STAGE 2: build + publish the container image. Needs: publish-pypi --
  # unreachable unless the PyPI stage above (including its tag-and-release
  # step) already succeeded on this exact commit.
  publish-docker:
    name: publish-docker
    needs: [release-intent, publish-pypi]
    if: needs.release-intent.outputs.release == 'true' && needs.publish-pypi.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # D-ORC-10-style gate (matches agent-utilities' own publish-docker job):
    # a protected GitHub Environment enables required-reviewer / wait-timer
    # rules once an admin configures them under
    # Settings > Environments > docker-publish. Safe to set here because this
    # is a normal job (runs-on + steps), NOT a `uses:` job -- putting
    # `environment:` on a `uses:` job makes the GitHub Actions parser reject
    # the whole file ("Unexpected value 'uses'"), which is exactly why
    # `publish-pypi` above does not have one.
    environment: docker-publish
    steps:
      # Belt-and-suspenders confirmation that this commit really is a
      # published release, not merely a commit that happens to follow one:
      # this workflow is triggered by a `vX.Y.Z` tag pointing at this exact
      # commit. Failing loudly here when no such tag exists catches a
      # workflow_dispatch from an untagged commit.
      - name: Require a vX.Y.Z release tag on the published commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tags="$(gh api "repos/${{ github.repository }}/tags?per_page=100" \
            | jq -r --arg sha "$HEAD_SHA" '.[] | select(.commit.sha == $sha) | .name')"
          if ! grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' <<<"$tags"; then
            echo "::error::release gate: no vX.Y.Z tag points at $HEAD_SHA -- publish-pypi should have created one on success. Refusing to publish the image against an unreleased commit."
            exit 1
          fi
          echo "release tag verified: $tags"

      - name: Checkout agent-webui
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute build metadata
        id: meta_build
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/agent-webui
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          build-args: |
            BUILD_SHA=${{ steps.meta_build.outputs.sha }}
            BUILD_TIME=${{ steps.meta_build.outputs.time }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Same check docker/build_and_push.sh runs locally before it will push --
      # confirms the pushed image's served bundle actually carries this commit,
      # not a stale cached layer, using the tag `metadata-action` just resolved
      # (so this pulls the exact manifest just pushed, not a mutable `:latest`
      # someone else could have moved in the meantime).
      - name: Verify pushed image serves today's build-info.txt
        run: |
          set -euo pipefail
          IMAGE_REF="$(head -n1 <<<"${{ steps.meta.outputs.tags }}")"
          INFO="$(docker run --rm --entrypoint sh "${IMAGE_REF}" -c \
            'cat "$(python3 -c "import agent_webui, os; print(os.path.join(os.path.dirname(agent_webui.__file__), \"dist\", \"build-info.txt\"))")"')"
          echo "${INFO}"
          grep -q "sha=${{ steps.meta_build.outputs.sha }}$" <<<"${INFO}"
