name: CI

# Companion of ci.yml (CI-STANDARD): a docs/spec-only change skips the real
# workflow, so this one reports the same required `gates` check as a success
# and branch protection never waits on it. The `paths:` list is the exact
# inverse of ci.yml's `paths-ignore:`. Spec changes still run the light
# spec-gates job.

on:
  pull_request:
    paths:
      - 'specs/**'
      - 'docs/**'
      - '**/*.md'
      - 'plans/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: pr-gates-skip-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "docs/spec-only change; the code gates do not apply"

  spec-gates:
    name: spec-gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: spec-status
        run: uvx --from 'git+https://github.com/Knuckles-Team/pipelines@main' pipelines-hook spec-status

      - name: spec-decomposition
        run: uvx --from 'git+https://github.com/Knuckles-Team/pipelines@main' pipelines-hook spec-decomposition

      - name: spec-trailers
        run: uvx --from 'git+https://github.com/Knuckles-Team/pipelines@main' pipelines-hook spec-trailers --base-ref "origin/${{ github.base_ref }}"
