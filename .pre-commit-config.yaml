repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.9.9
  hooks:
    - id: ruff
      args: [--fix, --exit-non-zero-on-fix]
      exclude: ^(tests/|test/|scripts/|script/)
    - id: ruff-format
      exclude: ^(tests/|test/|scripts/|script/)

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-added-large-files
      args: ['--maxkb=1000']
    - id: check-ast
      exclude: ^(tests/|test/|scripts/|script/)
    - id: check-yaml
    - id: check-toml
    - id: check-json
      exclude: ^(package-lock\.json|pnpm-lock\.yaml|bun\.lock|tsconfig\.json)$
    - id: fix-byte-order-marker
      exclude: .gitignore
    - id: check-merge-conflict
    - id: detect-private-key
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: no-commit-to-branch
      args: [--branch, staging, --branch, dev]

- repo: https://github.com/codespell-project/codespell
  rev: v2.4.1
  hooks:
    - id: codespell
      args: ["-L", "ans,linar,nam,tread,ot"]
      exclude: ^(package-lock\.json|pnpm-lock\.yaml|bun\.lock|tests/|test/|scripts/|script/)

- repo: https://github.com/nbQA-dev/nbQA
  rev: 1.9.1
  hooks:
    - id: nbqa-black

- repo: local
  hooks:
    - id: eslint
      name: eslint
      entry: pnpm lint
      language: system
      types: [ts, tsx]
      pass_filenames: false

    - id: typecheck
      name: typecheck
      entry: pnpm typecheck
      language: system
      types: [ts, tsx]
      pass_filenames: false
