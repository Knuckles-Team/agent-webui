[pytest]
testpaths = agent/agent_webui/__tests__ tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --cov=agent/agent_webui
    --cov-report=html
    --cov-report=term-missing
    --cov-report=json:htmlcov/coverage.json
    --cov-fail-under=50
    --verbose
    --tb=short
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow running tests
env =
    AGENT_UTILITIES_TESTING=true
filterwarnings =
    ignore:Module already imported so cannot be rewritten:pytest.PytestAssertRewriteWarning
