[pytest]
testpaths = agent/agent_webui/__tests__ tests
# Always import the in-repo backend package: without this, a pip-installed
# agent_webui in site-packages shadows agent/agent_webui at collection time
# and the suite exercises stale code.
pythonpath = agent
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --tb=short
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow running tests
env =
    AGENT_UTILITIES_TESTING=true
filterwarnings =
    ignore:Module already imported so cannot be rewritten:pytest.PytestAssertRewriteWarning
