# Pushes run a bounded fast gate; the full pytest, dependency-readiness, wheel,
# and repository-wide lint checks remain available at the manual stage and in
# hosted CI. Install the configured hooks with
# `pre-commit install --config .config/pre-commit.yaml`.
# `default_stages` keeps unspecified hooks on commit only; push checks opt in.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]  # P0.3: was [pre-commit, pre-push] -- see per-hook stages: below for what moved explicitly
exclude:
  ^(scripts/|.*skill_graphs/|.*pnpm-lock\.yaml|.*uv\.lock|.*\.db$|.*\.bak$|.*\.sqlite$)
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
  hooks:
  - id: check-added-large-files
    args: ["--maxkb=2000"]
    exclude: ^uv\.lock$|.*\.db$|.*\.bak$|.*\.sqlite$
  - id: check-ast
    exclude: ^(tests/|test/|scripts/|script/)
  - id: check-yaml
    args: ["--unsafe"]
  - id: check-toml
  - id: check-json
  - id: fix-byte-order-marker
    exclude: .gitignore
  - id: check-merge-conflict
  - id: detect-private-key
  - id: trailing-whitespace
  - id: end-of-file-fixer
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 6fec9b7edb08fd9989088709d864a7826dc74e80 # v0.15.12
  hooks:
  - id: ruff
    name: ruff check
    args: ["--ignore=E402"]
    exclude: ^(tests/|test/|scripts/|script/)
    stages: [pre-commit, pre-push, manual]
  - id: ruff-format
    name: ruff format
    exclude: ^(tests/|test/|scripts/|script/)
    stages: [pre-commit, pre-push, manual]
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: fc0f09a29bb495f4a91f00266155d6282d52485d # v1.20.2
  hooks:
  - id: mypy
    additional_dependencies: [pydantic==2.13.4, types-PyYAML==6.0.12.20260518, types-requests==2.33.0.20260518]
    args: ["--ignore-missing-imports"]
    stages: [pre-commit, pre-push, manual]
- repo: https://github.com/jendrikseipp/vulture
  rev: b0f67ba0044693aa9ec0d38fe460590facc98004 # v2.16
  hooks:
  - id: vulture
    pass_filenames: false
    args: [".", "--min-confidence", "95", "--exclude", "node_modules,dotnet,.venv"]
    require_serial: true
- repo: https://github.com/codespell-project/codespell
  rev: 2ccb47ff45ad361a21071a7eedda4c37e6ae8c5a # v2.4.2
  hooks:
  - id: codespell
    args: ["-L", "ans,linar,nam,tread,ot,", "--ignore-words=.config/codespell.ignore"]
    exclude: ^(tests/|test/|scripts/|script/)
- repo: https://github.com/PyCQA/bandit
  rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08 # 1.9.4
  hooks:
  - id: bandit
    args: ["--skip", "B101,B104,B105,B110,B112,B311,B404,B603,B607,B608"]
    exclude: ^(tests/|test/|scripts/|script/|__tests__/)
- repo: https://github.com/nbQA-dev/nbQA
  rev: d31b7eae1767c43460afb3ba130e0a6602933abe # 1.9.1
  hooks:
  - id: nbqa-ruff
    args: ["--fix"]
- repo: https://github.com/Knuckles-Team/pipelines
  rev: 7ae4192 # shared scanner argv fix + public-surface contract
  hooks:
  - id: public-surface
- repo: local
  hooks:
  - id: dependency-readiness
    name: Dependency readiness — every declared intra-fleet constraint is installable
    entry: bash -c 'P=""; d="$PWD"; while [ "$d" != "/" ]; do [ -d "$d/agent-packages/agents/repository-manager" ] && { P="$d/agent-packages/agents/repository-manager"; break; }; d=$(dirname "$d"); done; [ -n "$P" ] || P=repository-manager; uv run --no-project --python 3.12 --prerelease=allow --with "$P" python -m repository_manager.dependency_readiness .'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual]
  - id: uv-lock
    name: uv-lock (verify, never mutate)
    entry: bash -c 'repo=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)"); if [ -n "$AGENT_UTILITIES_ROOT" ]; then root="$AGENT_UTILITIES_ROOT"; else au_d="$repo"; root=""; while [ "$au_d" != "/" ]; do if [ -d "$au_d/agent-utilities/scripts" ]; then root="$au_d/agent-utilities"; break; fi; au_d=$(dirname "$au_d"); done; fi; if [ -d "$root" ] && [ "$repo" != "$root" ]; then mkdir -p .uv-workspace-siblings && ln -sfn "$root" .uv-workspace-siblings/agent-utilities; fi; uv lock --check'
    language: system
    files: ^(uv\.lock|pyproject\.toml|uv\.toml)$
    pass_filenames: false
    stages: [pre-push, manual]
- repo: local
  hooks:
  - id: okf-no-legacy-concepts
    name: OKF-CIS — no legacy CONCEPT ids
    entry: bash -c 'repo=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)"); if [ -n "$AGENT_UTILITIES_ROOT" ]; then root="$AGENT_UTILITIES_ROOT"; else d="$repo"; root=""; while [ "$d" != "/" ]; do if [ -d "$d/agent-utilities/scripts" ]; then root="$d/agent-utilities"; break; fi; d=$(dirname "$d"); done; fi; if [ ! -d "$root/scripts" ]; then echo "REFUSED - cannot locate agent-utilities/scripts from $repo (set AGENT_UTILITIES_ROOT)" >&2; exit 1; fi; python3 "$root/scripts/check_no_legacy_markers.py" . "$@"' --
    language: system
    pass_filenames: false
    always_run: true
  - id: lane-guard
    name: Lane guard — canonical checkout read-only + stray CARGO_TARGET_DIR (D-CP-3/D-CP-4 reach)
    entry: bash -c 'repo=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)"); if [ -n "$AGENT_UTILITIES_ROOT" ]; then root="$AGENT_UTILITIES_ROOT"; else d="$repo"; root=""; while [ "$d" != "/" ]; do if [ -d "$d/agent-utilities/scripts" ]; then root="$d/agent-utilities"; break; fi; d=$(dirname "$d"); done; fi; if [ ! -d "$root/scripts" ]; then echo "REFUSED - cannot locate agent-utilities/scripts from $repo (set AGENT_UTILITIES_ROOT)" >&2; exit 1; fi; python3 "$root/scripts/check_lane_guard.py"'
    language: system
    pass_filenames: false
    always_run: true
  - id: check-stubs
    name: Check for Active Stubs and TODOs
    entry: bash -c 'repo=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)"); if [ -n "$AGENT_UTILITIES_ROOT" ]; then root="$AGENT_UTILITIES_ROOT"; else d="$repo"; root=""; while [ "$d" != "/" ]; do if [ -d "$d/agent-utilities/scripts" ]; then root="$d/agent-utilities"; break; fi; d=$(dirname "$d"); done; fi; if [ ! -d "$root/scripts" ]; then echo "REFUSED - cannot locate agent-utilities/scripts from $repo (set AGENT_UTILITIES_ROOT)" >&2; exit 1; fi; python3 "$root/scripts/check_stubs.py" "$@"' --
    language: system
    types: [python]
  - id: check-sprawl
    name: Guardrail — anti-sprawl
    entry: bash -c 'repo=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)"); if [ -n "$AGENT_UTILITIES_ROOT" ]; then root="$AGENT_UTILITIES_ROOT"; else d="$repo"; root=""; while [ "$d" != "/" ]; do if [ -d "$d/agent-utilities/scripts" ]; then root="$d/agent-utilities"; break; fi; d=$(dirname "$d"); done; fi; if [ ! -d "$root/scripts" ]; then echo "REFUSED - cannot locate agent-utilities/scripts from $repo (set AGENT_UTILITIES_ROOT)" >&2; exit 1; fi; python3 "$root/scripts/check_sprawl.py" "$@"' --
    language: system
    args: ["."]
    pass_filenames: false
    always_run: true
  - id: complexity-staged
    name: Complexity (cccc) - no NEW function over cyclomatic 10 / cognitive 15, none regressed
    entry: python3 scripts/check_complexity_staged.py
    language: system
    pass_filenames: false
    always_run: true
  - id: eslint-staged
    name: eslint (staged .ts/.tsx) - errors block, warnings (incl. jsx-a11y) reported only
    # Require the locked local toolchain to be present instead of installing
    # dependencies from a commit/push hook. Set up the worktree once with
    # `pnpm install --frozen-lockfile`; this keeps the automatic gate bounded
    # and offline after setup.
    #
    # Scoped to the files pre-commit is about to commit (via `files:` below,
    # not a whole-repo `eslint .`) so this hook enforces the NEW/changed code
    # a commit actually introduces, the same "don't gate on unrelated debt"
    # principle as `complexity-staged` above -- not `--max-warnings=0`: the
    # jsx-a11y rules landed at `warn` (94 pre-existing findings across the
    # repo; see eslint.config.ts's own comment) specifically so they surface
    # without blocking every commit that touches an already-noisy file. Once
    # `pnpm exec eslint .` is fully clean of BOTH errors and warnings, add
    # `--max-warnings=0` here.
    entry: bash -c 'if [ ! -x node_modules/.bin/eslint ]; then echo "Run pnpm install --frozen-lockfile before pre-commit checks." >&2; exit 1; fi; pnpm exec eslint "$@"' --
    language: system
    files: \.(ts|tsx)$
    exclude: ^scripts/
    stages: [pre-commit, pre-push, manual]
  - id: no-fabrication-gate
    name: no-fabrication gate — Ecosystem view (BUG-008 / GOC-28)
    # Static scan rejecting fabricated operational state in production paths
    # this lane owns (EcosystemView.tsx and its widgets): Math.random()-based
    # ids/metrics, numeric `??` fallbacks standing in for real telemetry, and
    # setTimeout-driven fake async-completion toasts. See the script's own
    # header for the full rationale, scope boundary (this lane's files only —
    # other GOC-28/GOC-60 workers are concurrently editing nav-registry.ts /
    # SkillsView.tsx / GraphView.tsx / server.py / api_extensions.py in this
    # same repo right now), and the allowlist mechanism for reviewed
    # exceptions. Cheap (no tsc/vite needed) — runs standalone in addition to
    # being the first step of `pnpm build` (below) so a fabrication is caught
    # before the heavier build even starts.
    entry: bash -c 'node scripts/no_fabrication_gate.mjs'
    language: system
    pass_filenames: false
    always_run: true
    stages: [pre-push, manual]
  - id: pnpm-build
    name: pnpm build
    # Worktrees do not inherit `node_modules`; require developers to install
    # the tracked toolchain before this manual build rather than doing
    # network/package work in an automatic hook. `pnpm install --frozen-lockfile`
    # is the setup command.
    # NODE_OPTIONS mirrors the release workflow's own ceiling
    # (Knuckles-Team/pipelines python_web_pipeline.yml sets
    # --max-old-space-size=4096 on its "Build Frontend" step). Without it this
    # hook builds under the dev box's unbounded heap and cannot reproduce a
    # runner OOM, so a build that only fails in CI looks green locally.
    entry: bash -c 'if [ ! -x node_modules/.bin/tsc ] || [ ! -x node_modules/.bin/vite ]; then echo "Run pnpm install --frozen-lockfile before the manual build." >&2; exit 1; fi; NODE_OPTIONS=--max-old-space-size=4096 pnpm build'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual]
  # Release parity (offline): the publish workflow's ONLY two build steps are
  # "Build Frontend" (pnpm run build, above) and "Build package" (uv build).
  # The wheel build had no local gate at all, so a packaging break could only
  # ever be discovered by pushing to main and watching the release job -- and
  # when that job's logs expire, not even then. Runs fully offline against the
  # tracked lock; manual-only locally to keep the automatic push gate bounded,
  # and remains covered by hosted publication CI.
  - id: release-wheel-build
    name: release parity — uv build (wheel + sdist, manual)
    entry: bash -c 'set -e; rm -rf dist; uv build; wheel=$(find dist -maxdepth 1 -name "*.whl" -print -quit); test -n "$wheel"; python scripts/release/check_wheel_contract.py "$wheel"'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual]
  # The full `typecheck` gate is clean and takes about 26s with dependencies
  # installed; it remains manual-only so the automatic push gate checks only
  # changed TypeScript files and never installs the full frontend toolchain.
  # The full-repository
  # `lint` command still reports eight pre-existing ESLint errors; it stays
  # manual-only because it has no local differential comparator. The staged
  # `eslint-staged` hook above checks changed TS/TSX files on commit and push,
  # while `.mergequeue.yaml` retains differential enforcement for hosted runs.
  - id: typecheck
    name: CI/queue parity — tsc --noEmit (D-W5CG-1)
    entry: bash -c 'if [ ! -x node_modules/.bin/tsc ]; then echo "Run pnpm install --frozen-lockfile before manual typecheck." >&2; exit 1; fi; pnpm exec tsc --noEmit'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual]
  - id: lint
    name: CI/queue parity — eslint (D-W6PC-3; 8 pre-existing errors — informational, manual-only)
    entry: bash -c 'if [ ! -x node_modules/.bin/eslint ]; then echo "Run pnpm install --frozen-lockfile before manual lint." >&2; exit 1; fi; pnpm exec eslint'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual]
  - id: pytest
    name: pytest
    entry: bash -c 'repo=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)"); if [ -n "$AGENT_UTILITIES_ROOT" ]; then root="$AGENT_UTILITIES_ROOT"; else au_d="$repo"; root=""; while [ "$au_d" != "/" ]; do if [ -d "$au_d/agent-utilities/scripts" ]; then root="$au_d/agent-utilities"; break; fi; au_d=$(dirname "$au_d"); done; fi; if [ -d "$root" ] && [ "$repo" != "$root" ]; then mkdir -p .uv-workspace-siblings && ln -sfn "$root" .uv-workspace-siblings/agent-utilities; fi; test_target="tests"; for d in tests/unit test/unit tests test; do if [ -d "$d" ]; then test_target="$d"; break; fi; done; if [ -f uv.lock ]; then uv run --all-extras pytest "$test_target" -q --tb=short -m "not slow" --timeout=60; else pytest "$test_target" -q --tb=short -m "not slow" --timeout=60; fi'
    language: system
    types: [python]
    pass_filenames: false
    always_run: true
    stages: [manual]
  - id: check-agent-standards
    name: check agent standards
    entry: |-
      bash -c 'for f in $(find . -type f -name "agent_server.py" -not -path "*/\.venv/*" -not -path "*/__pycache__/*"); do grep -q "warnings.filterwarnings" "$f" && grep -q "file=sys.stderr" "$f" || { echo "Missing warnings.filterwarnings or file=sys.stderr in $f"; exit 1; }; done'
    language: system
    pass_filenames: false
    always_run: true
  - id: check-cli-help
    name: check cli help
    entry: |-
      bash -c 'for f in $(find . -type f \( -name "mcp_server.py" -o -name "agent_server.py" \) -not -path "*/\.venv/*" -not -path "*/__pycache__/*"); do mod=$(echo "$f" | sed -e "s/^\.\///" -e "s/\.py$//" -e "s/\//./g"); uv run python -m "$mod" --help >/dev/null || exit 1; done'
    language: system
    pass_filenames: false
    always_run: true
  - id: check-bumpversion
    name: validate bumpversion config
    entry: |-
      bash -c 'if [ -f ".bumpversion.cfg" ]; then bump2version patch --dry-run --allow-dirty; fi'
    language: system
    pass_filenames: false
    always_run: true
- repo: local
  hooks:
  - id: security-sanitizer
    name: Security and Garbage Sanitizer
    entry: python scripts/security_sanitizer.py
    language: python
    pass_filenames: false
    always_run: true
- repo: local
  hooks:
  - id: guardrail-tracked-privacy
    name: Guardrail — tracked public artifacts contain no host-specific data or local identities
    entry: python3 scripts/check_tracked_privacy.py
    language: system
    # NOT scoped, despite being expensive: a privacy leak (hostname, local
    # path, identity) can land in ANY tracked file type (docs, config,
    # fixtures, .ts/.tsx source), not just one directory, so no `files:`
    # regex narrower than "everything tracked" can be proven not to miss
    # one. Ported from agent-utilities' identically-named/identically-behaved
    # gate (`scripts/check_tracked_privacy.py`'s own module docstring notes
    # the two intentional adaptations for this repo: its own top-level
    # source trees, and .tsx/.jsx added to the source-suffix set since this
    # repo is TypeScript/React, not Rust/Python). This repo publishes to a
    # public GitHub org, same as agent-utilities.
    pass_filenames: false
    always_run: true

  - id: check-root-hygiene
    name: Repository root hygiene (manifest-declared entries only)
    entry: python3 scripts/check_root_hygiene.py
    language: system
    pass_filenames: false
    always_run: true
  - id: check-gitignore-convergence
    name: .gitignore carries the fleet-shared REQUIRED set
    entry: python3 scripts/check_gitignore_convergence.py
    language: system
    pass_filenames: false
    always_run: true
