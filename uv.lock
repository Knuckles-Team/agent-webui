version = 1
revision = 3
requires-python = ">=3.12, <3.15"
resolution-markers = [
    "python_full_version >= '3.14' and sys_platform == 'linux'",
    "python_full_version < '3.14' and sys_platform == 'linux'",
]
supported-markers = [
    "sys_platform == 'linux'",
]

[manifest]
overrides = [{ name = "fastmcp-slim", extras = ["client", "server"], specifier = ">=4.0.0b1" }]

[[package]]
name = "agent-connector-sdk"
source = { editable = ".uv-workspace-siblings/agent-utilities/.uv-workspace-siblings/agent-connector-sdk" }
dependencies = [
    { name = "anyio", marker = "sys_platform == 'linux'" },
    { name = "cryptography", marker = "sys_platform == 'linux'" },
    { name = "epistemic-graph", marker = "sys_platform == 'linux'" },
    { name = "fastmcp", marker = "sys_platform == 'linux'" },
    { name = "httpx", marker = "sys_platform == 'linux'" },
    { name = "httpx2", marker = "sys_platform == 'linux'" },
    { name = "pydantic", marker = "sys_platform == 'linux'" },
    { name = "pyyaml", marker = "sys_platform == 'linux'" },
]

[package.metadata]
requires-dist = [
    { name = "anyio", specifier = ">=4.13.0" },
    { name = "cryptography", specifier = ">=50.0.1" },
    { name = "epistemic-graph", specifier = ">=2.27.0,<3" },
    { name = "fastmcp", specifier = ">=4.0.3,<5" },
    { name = "httpx", specifier = ">=0.28.1" },
    { name = "httpx2", specifier = ">=2.12.0" },
    { name = "pydantic", specifier = ">=2.13.4,<3" },
    { name = "pyyaml", specifier = ">=6.0.3" },
]

[package.metadata.requires-dev]
docs = [{ name = "mkdocs-material", specifier = "==9.7.7" }]
test = [
    { name = "pytest", specifier = ">=9.1.1" },
    { name = "pytest-asyncio", specifier = ">=1.4.0" },
    { name = "pytest-timeout", specifier = ">=2.4.0" },
]

[[package]]
name = "agent-utilities"
source = { editable = ".uv-workspace-siblings/agent-utilities" }
dependencies = [
    { name = "agent-connector-sdk", marker = "sys_platform == 'linux'" },
    { name = "click", marker = "sys_platform == 'linux'" },
    { name = "cryptography", marker = "sys_platform == 'linux'" },
    { name = "defusedxml", marker = "sys_platform == 'linux'" },
    { name = "epistemic-graph", marker = "sys_platform == 'linux'" },
    { name = "filelock", marker = "sys_platform == 'linux'" },
    { name = "graphql-core", marker = "sys_platform == 'linux'" },
    { name = "idna", marker = "sys_platform == 'linux'" },
    { name = "joserfc", marker = "sys_platform == 'linux'" },
    { name = "jsonschema", marker = "sys_platform == 'linux'" },
    { name = "msgpack", marker = "sys_platform == 'linux'" },
    { name = "packaging", marker = "sys_platform == 'linux'" },
    { name = "pathspec", marker = "sys_platform == 'linux'" },
    { name = "pillow", marker = "sys_platform == 'linux'" },
    { name = "platformdirs", marker = "sys_platform == 'linux'" },
    { name = "psutil", marker = "sys_platform == 'linux'" },
    { name = "pydantic", extra = ["email"], marker = "sys_platform == 'linux'" },
    { name = "pydantic-settings", marker = "sys_platform == 'linux'" },
    { name = "pypdf", marker = "sys_platform == 'linux'" },
    { name = "pyyaml", marker = "sys_platform == 'linux'" },
    { name = "requests", marker = "sys_platform == 'linux'" },
    { name = "urllib3", marker = "sys_platform == 'linux'" },
]

[package.optional-dependencies]
agent-headless = [
    { name = "eunomia-core", marker = "sys_platform == 'linux'" },
    { name = "fasta2a", extra = ["pydantic-ai"], marker = "sys_platform == 'linux'" },
    { name = "fastapi", marker = "sys_platform == 'linux'" },
    { name = "fastmcp", marker = "sys_platform == 'linux'" },
    { name = "httpx", marker = "sys_platform == 'linux'" },
    { name = "pydantic-ai-harness", marker = "sys_platform == 'linux'" },
    { name = "pydantic-ai-skills", marker = "sys_platform == 'linux'" },
    { name = "pydantic-ai-slim", extra = ["cli", "mcp", "openai", "web"], marker = "sys_platform == 'linux'" },
    { name = "pydantic-graph", marker = "sys_platform == 'linux'" },
    { name = "pydantic-monty", marker = "sys_platform == 'linux'" },
    { name = "pyjwt", marker = "sys_platform == 'linux'" },
    { name = "python-multipart", marker = "sys_platform == 'linux'" },
    { name = "skill-graphs", marker = "sys_platform == 'linux'" },
    { name = "starlette", marker = "sys_platform == 'linux'" },
    { name = "universal-skills", marker = "sys_platform == 'linux'" },
    { name = "wasmtime", marker = "sys_platform == 'linux'" },
]
graph = [
    { name = "ladybug", marker = "sys_platform == 'linux'" },
]
metrics = [
    { name = "prometheus-client", marker = "sys_platform == 'linux'" },
]

