[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-webui"
version = "2.8.1"
description = "Agent Web Interface for Pydantic AI Agents"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14"]
requires-python = ">=3.12"
dependencies = [
    # The in-run harness: only `agent_utilities.core.paths` (XDG config/data dirs).
    "agent-utilities>=3.0.0,<4.0.0",
    # Persistence privacy: `agent_connector_sdk.privacy` scrubs values before the
    # WebUI stores or logs them.
    "agent-connector-sdk>=0.2.0,<1.0.0",
    "httpx>=0.28.1",
    # Edge properties travel to eg.graph.AddEdge / GetEdgesPage as MessagePack.
    "msgpack>=1.1.0",
    "fastapi>=0.143.3",
    "langfuse>=5.0.2",
    # server.py and orchestrator_model.py import pydantic_ai directly. Match the
    # agent-utilities pin; retain the browser UI extra.
    "pydantic-ai-slim[ui]==2.57.0",
    # api_extensions.py's `/upload` route takes a multipart Form/File payload --
    # FastAPI raises RuntimeError at route-registration time (not import time)
    # without this. Not pulled transitively by any of the deps above; verified
    # by an image built from exactly this dependency set crashing on startup
    # with "Form data requires python-multipart to be installed" (D-WUI-30).
    "python-multipart>=0.0.32",
    "sse-starlette>=3.5.0",
    "starlette>=1.8.0",
    "uvicorn>=0.54.0",
    "watchfiles>=1.3.0",
    "logfire[fastapi,starlette]>=5.2.0",
    # `agent_webui.host.decode_jwt` verifies bearer JWTs as an OpenID Connect relying party.
    "joserfc>=1.7.5"
]

[project.optional-dependencies]
test = [
    "pytest-xdist>=3.8.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",
    "pytest-env>=1.8.0",
    "pytest-timeout>=2.4.0",
    "pytest-randomly>=4.0.1",
    "pytest-repeat>=0.9.4",
    "networkx>=3.7",
    "opentelemetry-instrumentation-starlette>=0.65b0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-asgi>=0.65b0",
]

[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@knuckles.team"

[project.license]
text = "MIT"

[tool.uv.workspace]
members = ["."]

[tool.pipelines_hooks.public_surface]
repository = "Knuckles-Team/agent-webui"
distribution = "agent-webui"
pages_url = "https://knuckles-team.github.io/agent-webui/"
mcp_server = false

[tool.pipelines_hooks.ste]
paths = ["README.md", "AGENTS.md", "CLAUDE.md", "CONTRIBUTING.md", "CHANGELOG.md", "docs", "specs"]
exempt = ["specs/_template/*"]

[tool.ruff.format]
docstring-code-format = false
quote-style = "single"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
agent_webui = ["dist/**", "icon.png", "skills/**/*"]

[tool.setuptools.packages.find]
where = ["agent"]

# CONCEPT:AU-ECO.ui.agent-webui-skill-provider — contribute the kg-webui-* skills to the agent-utilities hub via
# the shared skill-provider entry-point group (resolved by core/providers.py).
[project.entry-points."agent_utilities.skill_providers"]
agent-webui = "agent_webui.skills"

[tool.uv]
# Resolution-only restriction (does not affect what ships): this repo is
# Linux-only (see the `Operating System :: POSIX :: Linux` classifier above).
# Every dependency resolves from PyPI; there are no git, path or editable sources.
environments = ["sys_platform == 'linux' and python_full_version >= '3.12'"]


[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402", "E501", "B008", "B904", "F841"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
