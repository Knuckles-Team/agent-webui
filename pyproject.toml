[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-webui"
version = "2.0.0"
description = "Agent Web Interface for Pydantic AI Agents"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3"]
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.139.2",
    "langfuse>=4.14.1",
    "pydantic-ai-slim[ui]>=2.14.1",
    "sse-starlette>=3.4.6",
    "starlette>=1.3.1",
    "uvicorn>=0.51.0",
    "watchfiles>=1.2.0",
    "logfire[fastapi,starlette]>=4.38.0"
]

[project.optional-dependencies]
test = [
    "pytest-xdist>=3.8.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",
    "pytest-env>=1.7.0",
    "pytest-timeout>=2.4.0",
    "networkx>=3.6.1",
    "opentelemetry-instrumentation-starlette>=0.65b0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-asgi>=0.65b0",
    "agent-utilities[agent,graph]>=1.4.0"
]

[[project.authors]]
name = "Project Maintainers"
email = "maintainers@users.noreply.github.com"

[project.license]
text = "MIT"

[tool.ruff.format]
docstring-code-format = false
quote-style = "single"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
agent_webui = ["dist/**", "icon.png", "skills/**/*"]

[tool.setuptools.packages.find]
where = ["agent"]

# CONCEPT:AU-ECO.ui.agent-webui-skill-provider — contribute the kg-webui-* skills to the agent-utilities hub via
# the shared skill-provider entry-point group (resolved by core/providers.py).
[project.entry-points."agent_utilities.skill_providers"]
agent-webui = "agent_webui.skills"

# Development and ecosystem validation use the co-versioned sibling source so
# the lock cannot silently fall back to an older published security posture.
# This table is uv-only and is not included in the wheel's dependency metadata.
[tool.uv.sources]
agent-utilities = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402", "E501", "B008", "B904", "F841"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
