[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-webui"
version = "0.40.0"
description = "Agent Web Interface for Pydantic AI Agents"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3"]
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.117.1",
    "langfuse>=4.5.1",
    "pydantic-ai>=1.88.0",
    "sse-starlette>=3.4.1",
    "starlette>=1.0.0",
    "uvicorn>=0.46.0",
    "watchfiles>=1.1.0",
    "logfire[fastapi,starlette]"
]

[project.optional-dependencies]
test = [
    "pytest-xdist>=3.6.0",
    "pytest",
    "pytest-asyncio", "pytest-cov",
    "pytest-env",
    "pytest-timeout",
    "networkx",
    "opentelemetry-instrumentation-starlette",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-asgi",
    "agent-utilities[agent,graph]"
]

[[project.authors]]
name = "Audel Rouhi"
email = "knucklessg1@gmail.com"

[project.license]
text = "MIT"

[tool.ruff.format]
docstring-code-format = false
quote-style = "single"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
agent_webui = ["dist/**", "icon.png"]

[tool.setuptools.packages.find]
where = ["agent"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402", "E501", "B008", "B904", "F841"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
